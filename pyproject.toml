[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argusai"
version = "0.1.0b0"
description = "Local-first multimodal agentic AI assistant powered by Ollama and Qdrant."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Moulaye S. Dahi" }
]
keywords = [
    "agentic-ai",
    "local-first",
    "ollama",
    "qdrant",
    "multimodal",
    "rag",
    "ocr",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dynamic = ["dependencies"]

[project.scripts]
argusai = "argusai.main:main"

[project.urls]
Homepage = "https://github.com/MoulayeSDh/ArgusAI"
Repository = "https://github.com/MoulayeSDh/ArgusAI"
Issues = "https://github.com/MoulayeSDh/ArgusAI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
web = [
    "crawl4ai>=0.8,<0.9",
    "playwright>=1.59,<2.0",
]
surya = [
    "surya-ocr>=0.13,<0.16",
]
dev = [
    "pytest>=8.0,<9.0",
]

<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<text x="70" y="90" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="white">Private PDF analysis</text>
<text x="70" y="130" font-family="Arial, sans-serif" font-size="20" fill="#B8B4D4">Bring a document. Keep its content and traces on your machine.</text>
